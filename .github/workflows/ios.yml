name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      video:
        description: Video id the simulator smoke test plays
        default: dQw4w9WgXcQ

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checks:
    name: Tests and live extraction (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() }}
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ !cancelled() }}
      - name: Resolve a stream from YouTube on the JVM
        if: ${{ !cancelled() }}
        working-directory: shared
        run: ./gradlew --no-daemon --stacktrace jvmTest -Paura.live=true

  ios:
    name: Build, simulator smoke test, IPA
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Xcode, and boot a simulator while everything builds
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print([x["udid"] for r,xs in sorted(d.items(), reverse=True) if "iOS" in r for x in xs if x["name"].startswith("iPhone")][0])')"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('shared/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      # The Kotlin build takes ten minutes; it only changes when shared/ does.
      - uses: actions/cache@v4
        id: shared
        with:
          path: modules/aura-native/ios/Frameworks
          key: aurashared-${{ hashFiles('shared/**', 'scripts/build-shared.sh') }}

      - name: Kotlin backend → AuraShared.xcframework
        if: steps.shared.outputs.cache-hit != 'true'
        run: scripts/build-shared.sh

      - run: npm install --no-audit --no-fund
      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -workspace ios/Aura.xcworkspace -scheme Aura -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build \
            > build/sim.log 2>&1 || { grep -E "error:|fatal" build/sim.log | head -60; tail -n 60 build/sim.log; exit 1; }

      - name: Smoke test in the simulator
        timeout-minutes: 15
        run: |
          scripts/sim-smoke.sh build/sim/Build/Products/Release-iphonesimulator/Aura.app \
            "${{ github.event.inputs.video || 'dQw4w9WgXcQ' }}" build/smoke

      # Built even when the smoke test fails, so there is always an IPA to look at.
      - name: Build for iPhone (unsigned)
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Aura.xcworkspace -scheme Aura -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            > build/device.log 2>&1 || { grep -E "error:|fatal" build/device.log | head -60; tail -n 60 build/device.log; exit 1; }
          version="$(node -p "require('./app.json').expo.version")"
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Aura.app build/Payload/
          echo "App extensions:" && ls build/Payload/Aura.app/PlugIns || echo "::warning::No share extension in the app"
          (cd build && zip -qry "Aura-$version.ipa" Payload)
          ls -lh build/*.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura-ios-${{ github.run_number }}
          path: |
            build/*.ipa
            build/smoke/
            build/*.log
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/*.ipa --title "Aura ${GITHUB_REF_NAME}" --generate-notes
