name: Checks

# Type check and tests on every branch except main (main runs them inside the iOS workflow).
on:
  push:
    branches-ignore: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() }}
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ !cancelled() }}
      - name: Resolve streams from YouTube on the JVM
        if: ${{ !cancelled() }}
        working-directory: shared
        run: ./gradlew --no-daemon jvmTest -Paura.live=true
